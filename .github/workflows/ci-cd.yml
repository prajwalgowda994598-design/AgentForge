# ─────────────────────────────────────────────────────────────────────────────
# AgentForge – GitHub Actions CI/CD Pipeline
#
# Triggers:
#   • push to main/develop → full build, test, and Docker push
#   • pull_request to main → lint + test only (no deploy)
#
# Secrets required (set in GitHub repo Settings → Secrets → Actions):
#   OPENROUTER_API_KEY          – OpenRouter API key (or OPENAI_API_KEY)
#   POSTGRES_PASSWORD           – used only in docker-compose production
#   NEO4J_PASSWORD              – used only in docker-compose production
#   SECRET_KEY                  – JWT signing secret
#   DOCKER_HUB_USERNAME         – Docker Hub username
#   DOCKER_HUB_TOKEN            – Docker Hub access token
#   AWS_ACCESS_KEY_ID           – (optional) for EC2 deploy
#   AWS_SECRET_ACCESS_KEY       – (optional)
#   AWS_REGION                  – (optional)
#   EC2_HOST                    – (optional) EC2 public IP / DNS
#   EC2_USER                    – (optional, default: ubuntu)
#   EC2_SSH_KEY                 – (optional) private SSH key PEM
# ─────────────────────────────────────────────────────────────────────────────

name: AgentForge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  BACKEND_IMAGE:  ${{ secrets.DOCKER_HUB_USERNAME }}/agentforge-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/agentforge-frontend
  PYTHON_VERSION: "3.12"   # Docker image uses 3.12; CI matches
  NODE_VERSION:   "20"

jobs:
  # ── Backend Lint & Test ─────────────────────────────────────────────────────
  backend-test:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest
    # No external services needed: LOCAL_DEV=true uses SQLite + FakeRedis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agentforge/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: agentforge

      - name: Run Ruff linter
        run: ruff check backend/ --select E,F,W --ignore E501
        working-directory: agentforge

      - name: Run tests
        working-directory: agentforge
        env:
          # LOCAL_DEV=true → SQLite in-memory + FakeRedis; no Postgres/Redis needed
          LOCAL_DEV:           "true"
          ENVIRONMENT:         test
          SECRET_KEY:          test-secret-key-not-for-production
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_PROVIDER:  local
          FAISS_INDEX_PATH:    /tmp/faiss_test
        run: pytest backend/tests/ -v --tb=short

  # ── Frontend Lint & Build ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend – Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agentforge/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: agentforge/frontend

      - name: TypeScript type check
        run: npm run type-check
        working-directory: agentforge/frontend

      - name: Lint
        run: npm run lint
        working-directory: agentforge/frontend

      - name: Build production bundle
        run: npm run build
        working-directory: agentforge/frontend
        env:
          VITE_API_URL: ""
          VITE_WS_URL:  ""

  # ── Docker Build & Push ─────────────────────────────────────────────────────
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./agentforge
          file:    ./agentforge/docker/Dockerfile.backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.BACKEND_IMAGE }}:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./agentforge
          file:    ./agentforge/docker/Dockerfile.frontend
          push:    true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache,mode=max

  # ── Deploy to AWS EC2 ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (EC2)
    runs-on: ubuntu-latest
    needs: docker-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/agentforge

            # Pull latest images
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            # Zero-downtime rolling update: backend first, then frontend
            docker compose pull
            docker compose up -d --no-deps backend
            sleep 15

            # Verify backend health before updating frontend
            curl -f http://localhost:8000/health || (echo "Backend health check failed!" && exit 1)

            docker compose up -d --no-deps frontend
            echo "Deployment successful at $(date)"
