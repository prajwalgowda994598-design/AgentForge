# ─────────────────────────────────────────────────────────────────────────────
# AgentForge – docker-compose.yml
# Full-stack local development and production deployment.
#
# Services:
#   postgres  – PostgreSQL 16
#   redis     – Redis 7
#   neo4j     – Neo4j 5 Community
#   backend   – FastAPI application
#   frontend  – React + Nginx
#
# Usage:
#   docker compose up --build        # Build and start all services
#   docker compose up -d             # Run in background
#   docker compose logs -f backend   # Follow backend logs
#   docker compose down -v           # Stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

# ── Custom Network ─────────────────────────────────────────────────────────────
networks:
  agentforge-net:
    driver: bridge

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  faiss_index:

# ── Services ───────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-agentforge}
      POSTGRES_USER:     ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge} -d ${POSTGRES_DB:-agentforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"   # Expose for local tools like DBeaver

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - agentforge-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: agentforge-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - agentforge-net
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agentforge-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST:    redis
      NEO4J_URI:     bolt://neo4j:7687
    volumes:
      - faiss_index:/app/vectorstore/faiss_index
      - ./sample_data:/app/sample_data:ro
    networks:
      - agentforge-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"

  # ── Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agentforge-frontend
    restart: unless-stopped
    networks:
      - agentforge-net
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
