# Render deployment configuration for backend and frontend
# See: https://render.com/docs/deploy-yaml

services:
  - type: web_service
    name: agentforge-backend-srv-d9p05anqj5pc738g1110
    env: python
    repo: https://github.com/prajwalgowda994598-design/AgentForge
    branch: main
    pythonVersion: "3.12.18"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LOCAL_DEV
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: OPENROUTER_API_KEY
        value: "${OPENROUTER_API_KEY}"
      - key: APP_DEBUG
        value: "false"
      - key: WORKERS
        value: "1"
    healthCheckPath: /health
    instanceType: "starter"
    region: "oregon"
    autoDeploy: true

  - type: web_service
    name: agentforge-frontend
    env: docker
    repo: https://github.com/prajwalgowda994598-design/AgentForge
    branch: main
    dockerfilePath: docker/Dockerfile.frontend
    envVars:
      - key: VITE_API_URL
        value: "https://<your-backend>.onrender.com"
    instanceType: "starter"
    region: "oregon"
    autoDeploy: true
