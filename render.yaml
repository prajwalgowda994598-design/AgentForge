# ─────────────────────────────────────────────────────────────────────────────
# AgentForge – Render deployment configuration
#
# Services:
#   agentforge-backend  – FastAPI on a free Web Service
#   agentforge-frontend – React SPA on a free Static Site
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your repo — Render will find this file automatically
#   4. Add environment variables marked "sync: false" in the Render dashboard:
#        OPENROUTER_API_KEY   →  your sk-or-v1-... key
#        SECRET_KEY           →  any random 64-char string
#        OPENAI_API_KEY       →  same OpenRouter key (used for embeddings)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend – FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: agentforge-backend
    runtime: python
    repo: https://github.com/prajwalgowda994598-design/AgentForge
    branch: main
    region: oregon
    plan: starter

    buildCommand: pip install -e . && pip install -r backend/requirements-render.txt

    startCommand: uvicorn agentforge.backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info

    healthCheckPath: /health

    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: ENVIRONMENT
        value: production
      - key: LOCAL_DEV
        value: "true"
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-20b:free,nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_SITE_URL
        value: https://agentforge-frontend-776a.onrender.com
      - key: OPENROUTER_SITE_NAME
        value: AgentForge
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_API_KEY
        sync: false
      # OPENAI_BASE_URL intentionally omitted — defaults to https://api.openai.com/v1
      # OpenRouter does NOT support /embeddings; if no real OPENAI_API_KEY is set,
      # the FAISS store gracefully degrades to empty (web-only search mode).
      - key: FAISS_DIMENSION
        value: "1536"
      - key: FAISS_INDEX_PATH
        value: /tmp/faiss_index
      - key: AGENT_TIMEOUT_SECONDS
        value: "300"
      - key: OPENAI_MAX_TOKENS
        value: "1024"
      - key: CRITIC_PASS_THRESHOLD
        value: "0.7"
      - key: MAX_RESEARCH_ITERATIONS
        value: "3"
      - key: CORS_ORIGINS_STR
        value: https://agentforge-frontend-776a.onrender.com,https://agentforge-frontend.onrender.com,http://localhost:3000,http://localhost:5173


  # ── Frontend – React SPA ────────────────────────────────────────────────────
  - type: web
    name: agentforge-frontend
    runtime: static
    repo: https://github.com/prajwalgowda994598-design/AgentForge
    branch: main

    rootDir: frontend

    buildCommand: npm install --legacy-peer-deps && npm run build

    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://agentforge-backend-0jm1.onrender.com
      - key: VITE_WS_URL
        value: wss://agentforge-backend-0jm1.onrender.com
